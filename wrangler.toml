name = "hospedaje-shadai"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "hospedaje-shadai"
# Bound in Cloudflare dashboard (Settings → Bindings). Placeholder for local.
database_id = "local-dev-placeholder"
migrations_dir = "migrations/d1"

[vars]
# Prevent cursor/identity.dev simulated admin on public Workers.
CURSOR_APP_ID = "cloudflare-public-worker"

[observability]
enabled = true
