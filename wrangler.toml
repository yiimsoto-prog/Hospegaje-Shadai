name = "hospedaje-shadai"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 binding `DB` → database `hospedaje-shadai` is configured in the
# Cloudflare dashboard (Settings → Bindings). Do not put a fake database_id
# here — it breaks `wrangler deploy` in Workers Builds.

[vars]
# Prevent cursor/identity.dev simulated admin on public Workers.
CURSOR_APP_ID = "cloudflare-public-worker"

[observability]
enabled = true
