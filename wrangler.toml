# Must match the Cloudflare Workers service the Git build is attached to.
name = "hospegaje-shadai"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
upload_source_maps = true

# Workers Builds often leaves Build command empty and only runs
# `npx wrangler deploy`. This runs OpenNext via node (no .bin permissions).
[build]
command = "node ./node_modules/@opennextjs/cloudflare/dist/cli/index.js build"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 binding `DB` → database `hospedaje-shadai` is configured in the
# Cloudflare dashboard (Settings → Bindings).

[vars]
CURSOR_APP_ID = "cloudflare-public-worker"
# Public Supabase project URL (safe to commit). Keys go in Worker Secrets.
SUPABASE_URL = "https://ipcakthexcmvazebppym.supabase.co"
NEXT_PUBLIC_SUPABASE_URL = "https://ipcakthexcmvazebppym.supabase.co"

[observability]
enabled = true
